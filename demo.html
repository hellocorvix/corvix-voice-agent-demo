<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Corvix AI Voice Agent — Live Demo</title>
<style>
  :root {
    --emerald: #10b981;
    --emerald-dark: #059669;
    --bg: #0a0f0d;
    --card: #111a16;
    --text: #e8f0ec;
    --muted: #8ba399;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; min-height: 100vh;
  }
  header {
    padding: 18px 16px 10px; text-align: center;
    border-bottom: 1px solid #1c2a24;
  }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: 4px; color: var(--emerald); }
  .subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .biz {
    margin: 10px auto 0; display: inline-block; font-size: 12px;
    background: var(--card); border: 1px solid #1e2f28; border-radius: 20px;
    padding: 6px 14px; color: var(--text);
  }
  #transcript {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    display: flex; flex-direction: column; gap: 10px;
    max-height: 46vh;
  }
  .bubble {
    max-width: 82%; padding: 10px 14px; border-radius: 16px;
    font-size: 15px; line-height: 1.45; word-wrap: break-word;
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: scale(.96); opacity: .4; } }
  .bubble.agent {
    align-self: flex-start; background: var(--card);
    border: 1px solid #1e2f28; border-bottom-left-radius: 4px;
  }
  .bubble.user {
    align-self: flex-end; background: var(--emerald-dark); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble .who { display: block; font-size: 11px; opacity: .7; margin-bottom: 3px; }
  #controls { padding: 10px 16px 26px; text-align: center; }
  #status {
    display: inline-block; font-size: 13px; color: var(--muted);
    background: var(--card); border: 1px solid #1e2f28;
    padding: 7px 16px; border-radius: 20px; margin-bottom: 14px;
    min-width: 150px;
  }
  #status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #555; margin-right: 7px; vertical-align: 1px;
  }
  #status.listening .dot { background: var(--emerald); }
  #status.thinking .dot { background: #f59e0b; animation: blink 1s infinite; }
  #status.speaking .dot { background: #38bdf8; animation: blink .5s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  #micBtn {
    width: 96px; height: 96px; border-radius: 50%; border: none; cursor: pointer;
    background: linear-gradient(135deg, var(--emerald), var(--emerald-dark));
    color: #fff; display: inline-flex; align-items: center; justify-content: center;
    box-shadow: 0 6px 24px rgba(16,185,129,.35);
    transition: transform .12s ease;
    position: relative;
  }
  #micBtn:active { transform: scale(.94); }
  #micBtn svg { width: 40px; height: 40px; }
  #micBtn.live::after {
    content: ""; position: absolute; inset: -6px; border-radius: 50%;
    border: 3px solid var(--emerald); opacity: .6;
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    0% { transform: scale(.92); opacity: .7; }
    100% { transform: scale(1.18); opacity: 0; }
  }
  #micLabel { margin-top: 10px; font-size: 13px; color: var(--muted); }
  #error {
    display: none; margin: 0 16px 12px; padding: 12px 14px; border-radius: 12px;
    background: #3b1113; border: 1px solid #7f1d1d; color: #fca5a5; font-size: 14px;
  }
  footer { padding: 12px; text-align: center; font-size: 11px; color: #4b5d55; }
</style>
</head>
<body>
  <header>
    <div class="brand">✦ CORVIX</div>
    <div class="subtitle">AI Voice Agent — Live Demo</div>
    <div class="biz">🍽️ Dehli Darbar Kabab House · AI Receptionist</div>
  </header>

  <div id="transcript"></div>

  <div id="controls">
    <div id="error"></div>
    <div><span id="status"><span class="dot"></span><span id="statusText">Tap the mic to talk</span></span></div>
    <button id="micBtn" aria-label="Start voice demo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"/>
        <path d="M5 10a7 7 0 0 0 14 0"/>
        <line x1="12" y1="17" x2="12" y2="22"/>
      </svg>
    </button>
    <div id="micLabel">Tap to start · no phone needed</div>
  </div>

  <footer>Demo runs on Corvix infrastructure · Deepgram · Gemini · ElevenLabs</footer>

<script>
(function () {
  "use strict";
  var SAMPLE_RATE = 16000;
  var ECHO_GUARD_MS = 500;   // don't send mic while agent audio is playing (+tail)

  var ws = null, audioCtx = null, workletNode = null, micStream = null;
  var running = false;
  var lastAgentAudioAt = 0;
  var speakTimer = null;

  var statusEl = document.getElementById("status");
  var statusText = document.getElementById("statusText");
  var transcriptEl = document.getElementById("transcript");
  var micBtn = document.getElementById("micBtn");
  var micLabel = document.getElementById("micLabel");
  var errorEl = document.getElementById("error");

  // ---- AudioWorklet: mic capture (resampled to 16 kHz) + PCM playback ----
  // Kept as a string (loaded via Blob) so the demo stays a single file.
  var workletCode = [
    "function resample(input, fromRate, toRate) {",
    "  if (fromRate === toRate) return input;",
    "  var ratio = fromRate / toRate;",
    "  var outLen = Math.floor(input.length / ratio);",
    "  var out = new Float32Array(outLen);",
    "  for (var i = 0; i < outLen; i++) {",
    "    var pos = i * ratio, i0 = Math.floor(pos);",
    "    var i1 = Math.min(i0 + 1, input.length - 1), frac = pos - i0;",
    "    out[i] = input[i0] * (1 - frac) + input[i1] * frac;",
    "  }",
    "  return out;",
    "}",
    "class VoiceProcessor extends AudioWorkletProcessor {",
    "  constructor() {",
    "    super();",
    "    this._micBuf = [];",
    "    this._playQueue = [];",
    "    this._playOffset = 0;",
    "    var self = this;",
    "    this.port.onmessage = function (e) {",
    "      var m = e.data;",
    "      if (m.type === 'play') {",
    "        var i16 = new Int16Array(m.data);",
    "        var f32 = new Float32Array(i16.length);",
    "        for (var i = 0; i < i16.length; i++) f32[i] = i16[i] / 32768;",
    "        self._playQueue.push(f32);",
    "      } else if (m.type === 'clear') {",
    "        self._playQueue = []; self._playOffset = 0;",
    "      }",
    "    };",
    "  }",
    "  process(inputs, outputs) {",
    "    var input = inputs[0], output = outputs[0];",
    "    if (input && input.length > 0) {",
    "      var samples = input[0];",
    "      if (sampleRate !== 16000) samples = resample(input[0], sampleRate, 16000);",
    "      for (var i = 0; i < samples.length; i++) this._micBuf.push(samples[i]);",
    "      var CHUNK = 320;", // 20 ms @ 16 kHz
    "      while (this._micBuf.length >= CHUNK) {",
    "        var frame = this._micBuf.splice(0, CHUNK);",
    "        var i16 = new Int16Array(CHUNK);",
    "        for (var j = 0; j < CHUNK; j++) {",
    "          var s = Math.max(-1, Math.min(1, frame[j]));",
    "          i16[j] = s < 0 ? s * 0x8000 : s * 0x7FFF;",
    "        }",
    "        this.port.postMessage({ type: 'mic', data: i16.buffer }, [i16.buffer]);",
    "      }",
    "    }",
    "    var out = output[0];",
    "    for (var k = 0; k < out.length; k++) {",
    "      var sample = 0;",
    "      if (this._playQueue.length > 0) {",
    "        var head = this._playQueue[0];",
    "        sample = head[this._playOffset++];",
    "        if (this._playOffset >= head.length) {",
    "          this._playQueue.shift(); this._playOffset = 0;",
    "        }",
    "      }",
    "      out[k] = sample;",
    "    }",
    "    return true;",
    "  }",
    "}",
    "registerProcessor('voice-processor', VoiceProcessor);"
  ].join("\n");

  function setStatus(mode, text) {
    statusEl.className = mode;
    statusText.textContent = text;
  }
  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
  }
  function hideError() {
    errorEl.style.display = "none";
  }
  function addBubble(role, text) {
    var div = document.createElement("div");
    div.className = "bubble " + (role === "user" ? "user" : "agent");
    var who = document.createElement("span");
    who.className = "who";
    who.textContent = role === "user" ? "You" : "🍽️ Dehli Darbar AI";
    div.appendChild(who);
    div.appendChild(document.createTextNode(text));
    transcriptEl.appendChild(div);
    transcriptEl.scrollTop = transcriptEl.scrollHeight;
  }
  function updateMicBtn() {
    micBtn.classList.toggle("live", running);
    micLabel.textContent = running ? "Tap to end" : "Tap to start · no phone needed";
  }

  function onWorkletMessage(e) {
    var m = e.data;
    if (!m || m.type !== "mic") return;
    if (!running || !ws || ws.readyState !== WebSocket.OPEN) return;
    // Half-duplex echo guard: while the agent is speaking, its voice would
    // loop back through the mic — drop mic audio during that window.
    if (performance.now() - lastAgentAudioAt < ECHO_GUARD_MS) return;
    try { ws.send(m.data); } catch (err) { /* will reconnect on close */ }
  }

  function onServerMessage(ev) {
    if (typeof ev.data === "string") {
      var msg;
      try { msg = JSON.parse(ev.data); } catch (e) { return; }
      if (msg.type === "transcript" && msg.text) {
        addBubble(msg.role, msg.text);
        if (msg.role === "user") setStatus("thinking", "Thinking…");
      }
      return;
    }
    // Binary = agent audio (16 kHz PCM16 mono).
    lastAgentAudioAt = performance.now();
    setStatus("speaking", "Speaking…");
    if (workletNode) {
      workletNode.port.postMessage({ type: "play", data: ev.data }, [ev.data]);
    }
    clearTimeout(speakTimer);
    speakTimer = setTimeout(function () {
      if (running) setStatus("listening", "Listening…");
    }, 700);
  }

  async function startSession() {
    hideError();
    setStatus("", "Connecting…");
    var stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
      });
    } catch (e) {
      setStatus("", "Tap the mic to talk");
      showError("Microphone blocked. Allow mic access for this site in the browser settings, then tap again.");
      return;
    }
    micStream = stream;

    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AC({ sampleRate: SAMPLE_RATE });
      if (audioCtx.state === "suspended") await audioCtx.resume();
      var blob = new Blob([workletCode], { type: "application/javascript" });
      await audioCtx.audioWorklet.addModule(URL.createObjectURL(blob));
      workletNode = new AudioWorkletNode(audioCtx, "voice-processor");
      var src = audioCtx.createMediaStreamSource(micStream);
      src.connect(workletNode);
      workletNode.connect(audioCtx.destination);
      workletNode.port.onmessage = onWorkletMessage;
    } catch (e) {
      setStatus("", "Tap the mic to talk");
      showError("Audio setup failed on this device (" + e.message + "). Try Chrome on Android.");
      stopSession(true);
      return;
    }

    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    try {
      ws = new WebSocket(proto + location.host + "/ws-voice");
    } catch (e) {
      showError("Could not open connection.");
      stopSession(true);
      return;
    }
    ws.binaryType = "arraybuffer";
    ws.onopen = function () {
      running = true;
      updateMicBtn();
      setStatus("listening", "Listening…");
    };
    ws.onmessage = onServerMessage;
    ws.onerror = function () {
      showError("Connection error — is the demo server running?");
    };
    ws.onclose = function () {
      var wasRunning = running;
      stopSession(true);
      if (wasRunning) showError("Disconnected. Tap the mic to reconnect.");
    };
  }

  async function stopSession(silent) {
    running = false;
    clearTimeout(speakTimer);
    try { if (ws) ws.close(); } catch (e) {}
    ws = null;
    try {
      if (workletNode) workletNode.port.postMessage({ type: "clear" });
      if (workletNode) workletNode.disconnect();
    } catch (e) {}
    workletNode = null;
    try { if (audioCtx) await audioCtx.close(); } catch (e) {}
    audioCtx = null;
    try {
      if (micStream) micStream.getTracks().forEach(function (t) { t.stop(); });
    } catch (e) {}
    micStream = null;
    if (!silent) hideError();
    setStatus("", "Tap the mic to talk");
    updateMicBtn();
  }

  micBtn.addEventListener("click", function () {
    if (running) { stopSession(); } else { startSession(); }
  });

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showError("This browser does not support microphone capture. Use Chrome on Android (or any modern browser) over HTTPS.");
  }
})();
</script>
</body>
</html>
